[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-history"
version = "0.1.0"
description = "Temporal repository-history indexing example for GestaltDB"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "gestaltdb[lmdb,arrow]>=0.12.1,<0.13",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "markdown-it-py>=3,<4",
  "pydantic>=2.8,<3",
  "pygit2>=1.15,<2",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2,<2"]
test = ["pytest>=8,<10"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_history"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["repo_history"]
