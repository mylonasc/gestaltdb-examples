":"b4dade78 Add Core 6 benchmarks and fix ","props":{"committed_at":"2026-09-14T10:42:14+00:00","is_merge":false,"message":"Add Core 6 benchmarks and fix doc examples","sha":"b4dade7884ab8707d72713ebc0ce5959f7f1e22d","url":"https://github.com/mylonasc/tf_gnns/commit/b4dade7884ab8707d72713ebc0ce5959f7f1e22d"},"prov":{"horizon":"2026-11-25T18:30:59.264796+00:00","method":"git-history","run_id":"viewer-live"},"t":0.9950785587518405,"time":"2026-09-14T10:42:14+00:00","title":"Add Core 6 benchmarks and fix doc examples\n\n- Add 6 new task YAMLs (09-14): factory-direct-uses, aggregation-modes,\n  save-load-roundtrip, configurations-recurrent-residual, data-semantics,\n  gcn-training-mode-forward.\n- graphnets.md: fix GNCellMLP example (int units, call before inspecting\n  all_weights), add graph_eval globals caveat and list-units warning.\n- graphs.md: replace broken GraphTuple.is_equal_by_value with field-wise\n  comparison; add -from+to / is_equal_by_value boundary notes.\n- backends.md: fix tf.concat axis and tf.is_finite for TF 2.21.\n- Regenerate api_index.json.\n"},{"id":"commit:c0078cf487b06b1fc70501e4","kind":"Commit","label":"5a59e76e Make tf_gnns agent benchmarks ","props":{"committed_at":"2026-09-13T23:56:57+00:00","is_merge":false,"message":"Make tf_gnns agent benchmarks pass by improving user docs","sha":"5a59e76e1b39d5de06cb61677bb899837276cc7d","url":"https://github.com/mylonasc/tf_gnns/commit/5a59e76e1b39d5de06cb61677bb899837276cc7d"},"prov":{"horizon":"2026-11-25T18:30:59.264796+00:00","method":"git-history","run_id":"viewer-live"},"t":0.9900674226061169,"time":"2026-09-13T23:56:57+00:00","title":"Make tf_gnns agent benchmarks pass by improving user docs\n\nBenchmarks now pass 8/8 under ollama/qwen3.8 with the packaged\ntf-gnns-user-docs skill. The main changes:\n\n- Expand agent_skill references: multi-graph batching, subgraph\n  extraction with edge_trimming_mode, assign_global check_shape,\n  GraphNetMLP with globals and explicit sizes, factory config with\n  composite aggregation and eval_tensor_dict/graph_tuple_eval parity,\n  SparseGCN edge weights and dtypes, documented GCNv2 ValueError\n  boundaries.\n- Add Environment/Agent Workflow guidance to SKILL.md so agents use\n  the uv project env and the docs tool instead of probing the\n  environment or reading library source.\n- Tighten the suite agent_prompt (read the matching topic, write the\n  solution immediately, avoid env spelunking) and raise task timeouts\n  to 600s.\n- Run validation commands with uv run python; add agent_docs CLI,\n  API index generator, docs tests, and lazy package-root exports.\n- Ignore agent_benchmark_results/.\n"},{"id":"commit:cf59410e791fc189b895453c","kind":"Commit","label":"92d041fb updated version","props":{"committed_at":"2026-09-14T20:46:06+00:00","is_merge":false,"message":"updated version","sha":"92d041fb199838cb712462cadb368da4a4186340","url":"https://github.com/mylonasc/tf_gnns/commit/92d041fb199838cb712462cadb368da4a4186340"},"prov":{"horizon":"2026-11-25T18:30:59.264796+00:00","method":"git-history","run_id":"viewer-live"},"t":0.9997680616790263,"time":"2026-09-14T20:46:06+00:00","title":"updated version\n"},{"id":"commit:db9ed7088fc309ebcb51d4b5","kind":"Commit","label":"0f05ec00 added an index creation step b","props":{"committed_at":"2026-09-14T20:31:13+00:00","is_merge":false,"message":"added an index creation step before running the tests (tests also check for agent skill and require the index to be avai","sha":"0f05ec009fcc7e244b044273103ccc74546ee883","url":"https://github.com/mylonasc/tf_gnns/commit/0f05ec009fcc7e244b044273103ccc74546ee883"},"prov":{"horizon":"2026-11-25T18:30:59.264796+00:00","method":"git-history","run_id":"viewer-live"},"t":0.9996524808081394,"time":"2026-09-14T20:31:13+00:00","title":"added an index creation step before running the tests (tests also check for agent skill and require the index to be available)\n"},{"id":"commit:eb7c7f054684688f2b1c9fdb","kind":"Commit","label":"5042738d Restructure agent docs concept","props":{"committed_at":"2026-09-14T11:37:27+00:00","is_merge":false,"message":"Restructure agent docs concept-first; fix GraphNetMLP global contract; shift benchmark params","sha":"5042738dd3055f05acfcd5d7ed8f59f713c4dade","url":"https://github.com/mylonasc/tf_gnns/commit/5042738dd3055f05acfcd5d7ed8f59f713c4dade"},"prov":{"horizon":"2026-11-25T18:30:59.264796+00:00","method":"git-history","run_id":"viewer-live"},"t":0.9955073598999352,"time":"2026-09-14T11:37:27+00:00","title":"Restructure agent docs concept-first; fix GraphNetMLP global contract; shift benchmark params\n\nConcept-first topic pages: every reference page now leads with How It\nWorks, Decision Guide, Parameter Key Facts, Boundaries & Gotchas, and a\nMinimal Skeleton before Rules/API Signatures/Output Contract, with\nexamples moved to a final Example Gallery. Agent_docs gains a --concepts\nextraction mode and the SKILL.md and benchmark suite agent_prompt now\ndirect agents to read concepts first and treat examples as reference,\nnot templates.\n\nDocs accuracy fixes: GraphNetMLP always builds a global block and fails\nwithout global_attr + repetition keys (verified against models/\ngraphnet.py); the no-global path is GraphNetMPNN_MLP only. Example\nGallery now shows reading object-graph edge widths via edge_tensor.\n\nAPI index: generator now unions root and submodule __all__ but keeps a\nsubmodule name only when the reference docs mention it (GCNv2 added,\nmaybe_patch_ld_library_path_for_tensorflow excluded), and filters\nunderscore-prefixed names.\n\nBenchmark shifts: tasks 09-14 parametrize so copy-pasting doc examples\nfails (units/widths/cores/reps/training paths all diverge from the docs).\nTrace rules flag examples-before-concepts retrieval and /tmp probe\nscripts. New reference solutions verified for all six shifted tasks.\n"},{"id":"commit:f1418e795d48cd60f01206ed","kind":"Commit","label":"3f7ea987 Merge pull request #11 from my","props":{"committed_at":"2026-09-1   // --- temporal forces: anchor pulls every x to mid-time center; ---
  // --- spread pulls left/right with strength growing from mid-time. ---
  const P = { anchor: 0.06, base: 0.015, far: 0.14, gamma: 1.0 };
  function temporalForce() {
    let nodes = [];
    function force(alpha) {
      for (const n of nodes) {
        if (n.t == null) continue;
        const d = n.t - 0.5;
        const target = CX + Math.sign(d) * Math.pow(Math.abs(d), P.gamma) * (W / 2 - 90);

  const idOf = x => (x && x.id) || x;
    const near = new Set([d.id]);

  relations.forEach(r => { ef.innerHTML += `<label class="kind"><input type="checkbox" value="${r}" checked> ${r}</label>`; });
  document.querySelectorAll('#kindFilters input, #edgeFilters input').forEach(i => i.onchange = visible);
  document.getElementById('tmin').oninput = document.getElementById('tmax').oninput = visible;
  document.getElementById('anchor').oninput = ev => { P.anchor = +ev.target.value / 100; sim.force('anchor').strength(P.anchor); sim.alpha(0.4).restart(); };
  document.getElementById('spread').oninput = ev => { P.far = +ev.target.value / 100; sim.alpha(0.4).restart(); };
  document.getElementById('ldist').oninput = ev => { sim.force('link').distance(+ev.target.value); sim.alpha(0.4).restart(); };
  document.getElementById('charge').oninput = ev => { sim.force('charge').strength(-ev.target.value); sim.alpha(0.4).restart(); };
  document.getElementById('labels').onchange = ev => { showLabels = ev.target.checked; paint(); };
  document.getElementById('bytime').onchange = ev => { colorByTime = ev.target.checked; paint(); };
  document.getElementById('find').onclick = () => {
    const q = document.getElementById('search').value.toLowerCase();
    const hit = DATA.nodes.find(n => n.label.toLowerCase().includes(q));
    if (hit) select(hit);
  };
  document.getElementById('pause').onclick = ev => {
    if (sim.alpha() > 0) { sim.stop(); ev.target.textContent = 'Resume'; }
    else { sim.restart(); ev.target.textContent = 'Pause'; }
  };
  document.getElementById('reset').onclick = () => { svg.transition().call(d3.zoom().transform, d3.zoomIdentity); select(null); };
  const lg = document.getElementById('legend');
  kinds.forEach(k => { lg.innerHTML += `<div><span style="display:inline-block;width:10px;height:10px;background:${kindColor(k)}"></span> ${k}</div>`; });
  lg.innerHTML += '<div><span style="color:#1f6feb">━━</span> factual link</div><div><span style="color:#9e6a03">┅</span> inferred link</div>';
  paint();
})();
</script>
</body>
</html>
